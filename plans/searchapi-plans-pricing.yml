model: >-
  Prepaid monthly search credits. Billing is pay-per-success: only searches returning
  HTTP 200 are charged, failed requests are not. One MCP tool call counts as one search.
  Price per 1,000 searches falls as the committed monthly volume rises; all published
  tiers are self-serve and share the same feature set and the same hourly cap policy.
