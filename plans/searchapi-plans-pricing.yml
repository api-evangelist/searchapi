overage:
  published: false
  note: >-
    No separate overage rate is published. The per-1,000 price attached to each tier is
    the effective rate; growth past a tier's included volume is handled by moving to the
    next tier rather than by a documented overage charge.
enterprise:
  contact_only: true
  note: >-
    Volumes above 5M searches/month, zero-retention (no-logging) request handling, and
    uptime commitments are handled through sales rather than a published plan. The
    `zero_retention` request parameter is documented as Enterprise-only.
derived_fields:
  hourly_searches:
    method: derived
    formula: included_searches * 0.20
    note: >-
      SearchApi publishes the rule ("up to 20% of your plan's credits each hour") but not
      the resulting number per tier. `hourly_searches` is that arithmetic, not a quoted
      figure. The authoritative live value is `api_usage.hourly_rate_limit` from
      GET /api/v1/me.
