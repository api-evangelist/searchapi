relationships: []
relationships_note: >-
  Intentionally empty. No field in any response is a foreign key into another SearchApi
  resource. Cross-object linkage exists only OUTSIDE the API — `link` fields point at the
  originating third-party site (google.com, amazon.com), not back into SearchApi.
polymorphism:
  discriminator: engine
  note: >-
    The response schema is polymorphic on the request's `engine` parameter, not on a field
    inside the payload. Which blocks are present, and their internal shape, is determined
    by the engine chosen at call time. A consumer must key off the engine it asked for; the
    body carries no type tag. This is the single most important thing to know when writing
    a parser against SearchApi.
