    conforms: true
    evidence: >-
      ISO/IEC 27001:2022 certification announced in the June 2026 update
      (https://www.searchapi.io/announcements, published 2026-07-02); certificate stated to
      be held in the trust center at https://security.searchapi.io/.
  - id: gdpr
    conforms: true
    evidence: >-
      GDPR compliance announced in the July 2026 update (published 2026-08-06); Data
      Processing Agreement published at https://www.searchapi.io/legal/dpa; zero-retention
      (no-logging) request option available on enterprise plans via `zero_retention=true`.
  - id: mcp
    conforms: true
    evidence: >-
      Hosted MCP server at https://www.searchapi.io/mcp, streamable-HTTP transport, listed
      active in the official MCP registry as `io.searchapi/mcp` since 2026-01-29 against
      server schema 2025-12-11. Live tools/list is auth-gated (401).
    ref: mcp/searchapi-mcp.yml
  - id: oauth2
    conforms: true
    scope: MCP surface only
    evidence: >-
      Authorization code + refresh token grants with PKCE S256, published at
      https://www.searchapi.io/.well-known/oauth-authorization-server. The REST SERP API
      has no OAuth surface — it is API-key only.
    ref: scopes/searchapi-scopes.yml
  - id: rfc8414-authorization-server-metadata
    conforms: true
    evidence: 'HTTP 200 JSON at /.well-known/oauth-authorization-server (probed 2026-08-13).'
  - id: rfc9728-protected-resource-metadata
    conforms: true
    evidence: >-
      HTTP 200 JSON at /.well-known/oauth-protected-resource and at the resource-specific
      /.well-known/oauth-protected-resource/mcp, advertised in the WWW-Authenticate header
      of an anonymous 401 from /mcp (probed 2026-08-13).
  - id: rfc7591-dynamic-client-registration
    conforms: true
    evidence: '`registration_endpoint: https://www.searchapi.io/oauth/register` with `token_endpoint_auth_methods_supported: ["none"]` — public clients can self-register.'
  - id: rfc7636-pkce
    conforms: true
    evidence: '`code_challenge_methods_supported: ["S256"]`.'
  - id: openidconnect
    conforms: false
    evidence: 'No /.well-known/openid-configuration (probed 2026-08-13 -> HTTP 404). The OAuth server issues access tokens for MCP, not identity tokens.'
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors are a flat `{"error": "<message>"}` JSON body with `content-type:
      application/json`, not `application/problem+json`. Observed on a live 401.
    ref: errors/searchapi-problem-types.yml
  - id: rfc6749-ratelimit-headers
    conforms: false
    evidence: >-
      No X-RateLimit-*, RateLimit-* or Retry-After headers on any observed response; the
      hourly cap is only visible by polling GET /api/v1/me.
    ref: rate-limits/searchapi-rate-limits.yml
  - id: rfc8594-sunset-header
    conforms: false
    evidence: No Sunset/Deprecation headers and no published deprecation policy.
