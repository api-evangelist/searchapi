note: >-
  SearchApi's conformance profile is lopsided by design: the REST SERP surface conforms to
  almost no cross-cutting API standard (API key only, flat JSON errors, no problem+json, no
  rate-limit headers), while the MCP surface added in 2026 conforms to a genuinely current
  stack — MCP with streamable HTTP, OAuth 2.1-style authorization code + PKCE S256, RFC 8414
  authorization server metadata, RFC 9728 protected resource metadata, and RFC 7591 dynamic
  client registration. The agent-facing half of this provider is materially better
  standardized than the developer-facing half.
standards:
