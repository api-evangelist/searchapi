note: >-
  SearchApi is the degenerate-but-instructive case for a tool crosswalk: the entire
  SERP product is ONE REST operation, `search` on GET/POST /api/v1/search,
  parameterized by `engine`. Every MCP tool therefore binds to that same operationId
  and differs only in the value it pins into `engine` (plus per-engine extra
  parameters). The tool inherits `search`'s parameters as its real input schema, with
  `engine` bound rather than free. Confidence is `high` on the binding itself — the
  provider's own docs describe each tool as the MCP face of the matching engine — and
  the residual uncertainty is in the per-engine parameter tail, which is documented
  per engine page and not in the single generated OpenAPI.
  NO FABRICATION: the live MCP `tools/list` is OAuth-gated (HTTP 401), so tools are
  mapped by published name and engine semantics, not by introspected inputSchema.
surfaces:
  openapi:
    - file: openapi/searchapi-search-api-openapi.yml
      operations: 1
      gated: false
      note: Generated from public docs; SearchApi publishes no machine-readable OpenAPI.
    - file: openapi/searchapi-account-api-openapi.yml
      operations: 2
      gated: false
  graphql:
    endpoint: null
    note: No GraphQL surface.
  mcp:
    url: https://www.searchapi.io/mcp
    transport: streamable-http
    gated: true
    gate: OAuth bearer (scope `mcp`) or static X-MCP-Token header; anonymous tools/list returns 401.
binding_model:
  operation: search
  bound_parameter: engine
  note: >-
    `rest: [search]` + `binding: engine=<value>` should be read as "call operationId
    `search` with `engine` pinned to this value". Free parameters carried through from
    the operation include q, location, uule, device, gl, hl, safe, time_period, page
    and zero_retention.
