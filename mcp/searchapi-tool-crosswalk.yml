rest_only:
  - operation: getAccount
    reason: >-
      GET /api/v1/me (Account API) returns plan usage, remaining credits and the hourly
      rate limit. No MCP tool exposes it, so an agent driving the MCP server cannot see
      how much quota it has left or how close it is to the hourly cap — the one runtime
      signal an autonomous consumer most needs.
  - operation: getSearchAnalytics
    reason: >-
      GET /api/v1/search_analytics (Search Analytics API) returns per-engine success
      rates, error rates and latency buckets. Not exposed as an MCP tool.
