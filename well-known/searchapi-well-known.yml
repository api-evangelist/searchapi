note: >-
  Two real documents are served: RFC 8414 OAuth Authorization Server Metadata and
  RFC 9728 OAuth Protected Resource Metadata. Both exist because SearchApi's hosted
  MCP server (https://www.searchapi.io/mcp) now accepts OAuth bearer tokens in
  addition to the legacy static X-MCP-Token header — the protected-resource document
  names the MCP endpoint as the resource. Every other probed path returns HTTP 404
  with the Rails application's HTML 404 page (17,478 bytes), which is a miss, not a
  document. The trust-center host (security.searchapi.io) is a Vite single-page app
  whose catch-all answers HTTP 200 with a 604-byte HTML shell for EVERY path,
  including /.well-known/security.txt and /.well-known/agent-card.json — those are
  recorded as soft-200 shells and explicitly NOT counted as hits.
