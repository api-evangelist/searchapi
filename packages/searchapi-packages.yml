note: >-
  SearchApi ships NO first-party REST client library in any language. The docs publish
  copy-paste samples in Python, Node, Ruby, Java, Go, PHP, Bash, R, Kotlin, Swift, C#, C
  and C++, but there is no `searchapi` package on npm, PyPI, RubyGems, Maven Central,
  NuGet, crates.io or pkg.go.dev that SearchApi publishes as an API client. What the
  company does distribute are three integration/agent connectors plus one general-purpose
  Ruby HTTP gem. Registry namespace hygiene is worth recording: npm `searchapi-mcp` and
  PyPI `searchapi` both EXIST but belong to unrelated third parties (see
  namespace_collisions), so a developer searching a registry by the company's name lands
  on someone else's code.
  Because no first-party REST SDK exists, no `SDKs` pointer is emitted — that would
  overstate the surface.
