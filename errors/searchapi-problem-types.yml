problem_types:
  - status: 401
    title: Invalid API key
    body: '{"error": "Invalid API key."}'
    method: probed
    evidence: >-
      GET https://www.searchapi.io/api/v1/search?engine=google&q=test with no credentials
      returned HTTP 401 and this exact body on 2026-08-13. GET /api/v1/me returned the
      same.
    remediation: >-
      Supply the key as `api_key=` or as `Authorization: Bearer <API_KEY>`. Not retryable.
  - status: 400
    title: Bad request
    body: '{"error": "<message>"}'
    method: derived
    evidence: 400 response modeled on the `search` operation in the generated OpenAPI.
    remediation: >-
      Check required parameters (`engine`, `q`) and engine-specific constraints — e.g.
      `uule` and `location` are mutually exclusive on the google engine.
  - status: 413
    title: Request Entity Too Large
    method: searched
    evidence: >-
      Documented pagination failure mode: `next_page_token` grows across pages
      (2KB -> 5KB -> 8KB+), and long tokens in a GET query string exceed request-size
      limits.
    remediation: >-
      Switch to `POST /api/v1/search` and send the token (and the API key) in the JSON
      body instead of the URL query string. POST support was added in January 2026.
  - status: 414
    title: URI Too Long
    method: searched
    evidence: Same pagination failure mode as 413 — URL length limits on long `next_page_token` values.
    remediation: Use POST with a JSON body rather than a GET query string.
  - status: 429
    title: Rate limit / hourly credit cap exceeded
    method: derived
    evidence: >-
      Modeled on the `search` operation in the generated OpenAPI as the conventional
      exhaustion status. NOT observed and NOT documented — SearchApi publishes the hourly
      cap rule (20% of monthly credits per hour) but never states the status code, body,
      or whether a `Retry-After` is returned.
    remediation: >-
      Poll GET /api/v1/me and compare `api_usage.searches_this_hour` to
      `api_usage.hourly_rate_limit` before retrying; no `Retry-After` is emitted.
    confidence: low
    ref: rate-limits/searchapi-rate-limits.yml
