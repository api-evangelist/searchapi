source: https://www.searchapi.io/announcements
trust_center:
  url: https://security.searchapi.io/
  status: 200
  title: Trust center
  discovered_via: >-
    Linked from the site footer and named in the July 2026 changelog entry
    (published 2026-08-06): "GDPR documentation sits alongside our ISO/IEC 27001:2022
    certificate in our Trust Center."
  machine_readable: false
  note: >-
    The trust center is a Vite single-page application. The HTML served to a non-JS client
    is a 604-byte shell containing only `<title>Trust center</title>`; the certificate and
    policy inventory is rendered client-side, and the SPA's catch-all answers HTTP 200
    with that same shell for every path probed (including /.well-known/security.txt and
    /.well-known/agent-card.json). The JS bundle exposes no fetchable JSON API. So the
    trust center is REAL and it is the provider's own host, but its contents are not
    machine-readable and the certifications below are sourced from SearchApi's own dated
    announcements rather than from the trust center document itself.
