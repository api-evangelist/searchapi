- name: SearchApi Account & Analytics API
  description: >-
    The two account-management endpoints SearchApi documents alongside its SERP surface. GET /api/v1/me
    returns the calling key's monthly allowance, month-to-date usage, remaining credits, searches made
    in the current hour and the hourly rate limit. GET /api/v1/search_analytics returns aggregated success
    rate, error rate and latency for the account's own searches, bucketed daily or hourly and optionally
    filtered to a single engine. These are the only endpoints exposing runtime quota and reliability signal
    — SearchApi returns no rate-limit response headers, so polling /api/v1/me is the sole machine-readable
    view of remaining headroom.
  humanURL: https://www.searchapi.io/docs/account-api
  baseURL: https://www.searchapi.io/api/v1
